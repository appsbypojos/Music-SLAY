# Автоматический production-деплой при обновлении main или ручном запуске из Actions.
# Секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID задаются в GitHub repository settings.
# Smoke test проверяет, что HTML ссылается на JS bundle именно из текущей сборки
# и что этот bundle доступен с production Worker.
name: Deploy MUSIC SLAY 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
          command: deploy
      - name: Verify deployed frontend entrypoint
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";

          const base = "https://music-slay-2026.vda45lol.workers.dev";
          const builtAssets = await readdir("dist/assets");
          const builtBundles = builtAssets.filter((name) => name.endsWith(".js"));
          if (builtBundles.length !== 1) {
            throw new Error("Expected exactly one built JavaScript bundle, found: " + builtBundles.join(", "));
          }

          const expectedPath = "/assets/" + builtBundles[0];
          console.log("EXPECTED_APP_JS", expectedPath);

          let lastFailure = "deployment has not propagated";
          for (let attempt = 1; attempt <= 18; attempt++) {
            const page = await fetch(base + "/?smoke=" + Date.now(), {
              cache: "no-store",
              headers: { "Cache-Control": "no-cache" }
            });
            const html = await page.text();
            console.log("ATTEMPT", attempt, "PAGE", page.status, page.headers.get("content-type"), "EXPECTED_SCRIPT_PRESENT", html.includes(expectedPath));

            if (page.ok && html.includes(expectedPath)) {
              const assetUrl = new URL(expectedPath, base);
              const asset = await fetch(assetUrl, {
                cache: "no-store",
                headers: { "Cache-Control": "no-cache" }
              });
              const js = await asset.text();
              const contentType = asset.headers.get("content-type") || "";
              console.log("APP_JS", asset.status, contentType, assetUrl.pathname, "bytes=" + js.length);

              if (asset.ok && /javascript|ecmascript/i.test(contentType) && js.length > 1000) {
                console.log("FRONTEND_APP_SMOKE_TEST_OK");
                process.exit(0);
              }
              lastFailure = "expected bundle returned invalid response: " + asset.status + " " + contentType;
            } else {
              lastFailure = "homepage has not switched to this build's asset manifest yet";
            }

            if (attempt < 18) await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          throw new Error("Frontend deployment verification failed after 90 seconds: " + lastFailure);
          NODE
