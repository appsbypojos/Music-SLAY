name: Deploy MUSIC SLAY 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify deployed frontend entrypoint
        run: |
          node --input-type=module <<'NODE'
          const base = "https://music-slay-2026.vda45lol.workers.dev";
          const page = await fetch(base + "/?smoke=" + Date.now(), { cache: "no-store" });
          const html = await page.text();
          console.log("PAGE", page.status, page.headers.get("content-type"));
          if (!page.ok) throw new Error("Homepage returned HTTP " + page.status);
          const scripts = [...html.matchAll(/<script\\b([^>]*)>/gi)];
          const match = scripts.map((entry) => {
            const attrs = entry[1];
            const src = attrs.match(/\\bsrc=["']([^"']+)["']/i)?.[1];
            return { attrs, src };
          }).find((entry) => entry.src && /\\.js(?:[?#]|$)/i.test(entry.src) && /\\btype=["']module["']/i.test(entry.attrs) && !/^https?:/i.test(entry.src));
          if (!match) throw new Error("Vite application module entrypoint not found in deployed HTML: " + html.slice(0, 1200));
          const assetUrl = new URL(match.src, base);
          const asset = await fetch(assetUrl, { cache: "no-store" });
          const js = await asset.text();
          console.log("APP_JS", asset.status, asset.headers.get("content-type"), assetUrl.pathname, "bytes=" + js.length);
          if (!asset.ok || !/javascript|ecmascript/i.test(asset.headers.get("content-type") || "")) {
            throw new Error("Application JavaScript entrypoint is not served as JavaScript");
          }
          if (js.length < 1000) throw new Error("Application JavaScript entrypoint appears empty or incomplete");
          if (!js.includes("Не удалось открыть экран")) throw new Error("Deployed application bundle does not contain the expected MUSIC SLAY UI");
          console.log("FRONTEND_APP_SMOKE_TEST_OK");
          NODE
