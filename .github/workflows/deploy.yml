name: Deploy MUSIC SLAY 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify deployed frontend entrypoint
        run: |
          node --input-type=module <<'NODE'
          const base = "https://music-slay-2026.vda45lol.workers.dev";
          const page = await fetch(base + "/?smoke=" + Date.now(), { cache: "no-store" });
          const html = await page.text();
          console.log("PAGE", page.status, page.headers.get("content-type"));
          if (!page.ok) throw new Error("Homepage returned HTTP " + page.status);
          const match = html.match(/<script[^>]+src=["']([^"']+\.js)["']/i);
          if (!match) throw new Error("Built JS entrypoint not found in deployed HTML");
          const assetUrl = new URL(match[1], base);
          const asset = await fetch(assetUrl, { cache: "no-store" });
          const js = await asset.text();
          console.log("JS", asset.status, asset.headers.get("content-type"), assetUrl.pathname, "bytes=" + js.length);
          if (!asset.ok || !/javascript|ecmascript/i.test(asset.headers.get("content-type") || "")) {
            throw new Error("JavaScript entrypoint is not served as JavaScript");
          }
          if (js.length < 1000) throw new Error("JavaScript entrypoint appears empty or incomplete");
          console.log("FRONTEND_SMOKE_TEST_OK");
          NODE
