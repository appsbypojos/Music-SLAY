name: Deploy MUSIC SLAY 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
          command: deploy
      - name: Verify deployed frontend entrypoint
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const base = "https://music-slay-2026.vda45lol.workers.dev";
          const builtHtml = await readFile("dist/index.html", "utf8");
          const builtScript = [...builtHtml.matchAll(/<script\b([^>]*)>/gi)]
            .map((entry) => {
              const src = entry[1].match(/\bsrc=["']([^"']+)["']/i)?.[1];
              return { attrs: entry[1], src };
            })
            .find((entry) => entry.src && /\.js(?:[?#]|$)/i.test(entry.src) && /\btype=["']module["']/i.test(entry.attrs) && !/^https?:/i.test(entry.src));

          if (!builtScript) throw new Error("Built Vite JavaScript entrypoint not found in dist/index.html");
          const expectedPath = new URL(builtScript.src, base).pathname;
          console.log("EXPECTED_APP_JS", expectedPath);

          let lastFailure = "deployment has not propagated";
          for (let attempt = 1; attempt <= 18; attempt++) {
            const page = await fetch(base + "/?smoke=" + Date.now(), {
              cache: "no-store",
              headers: { "Cache-Control": "no-cache" }
            });
            const html = await page.text();
            const match = [...html.matchAll(/<script\b([^>]*)>/gi)]
              .map((entry) => {
                const attrs = entry[1];
                const src = attrs.match(/\bsrc=["']([^"']+)["']/i)?.[1];
                return { attrs, src };
              })
              .find((entry) => entry.src && /\.js(?:[?#]|$)/i.test(entry.src) && /\btype=["']module["']/i.test(entry.attrs) && !/^https?:/i.test(entry.src));

            console.log("ATTEMPT", attempt, "PAGE", page.status, page.headers.get("content-type"), "SCRIPT", match?.src || "missing");

            if (page.ok && match && new URL(match.src, base).pathname === expectedPath) {
              const assetUrl = new URL(match.src, base);
              const asset = await fetch(assetUrl, { cache: "no-store", headers: { "Cache-Control": "no-cache" } });
              const js = await asset.text();
              const contentType = asset.headers.get("content-type") || "";
              console.log("APP_JS", asset.status, contentType, assetUrl.pathname, "bytes=" + js.length);

              if (asset.ok && /javascript|ecmascript/i.test(contentType) && js.length > 1000 && js.includes("Не удалось открыть экран")) {
                console.log("FRONTEND_APP_SMOKE_TEST_OK");
                process.exit(0);
              }
              lastFailure = "expected bundle returned invalid response: " + asset.status + " " + contentType;
            } else {
              lastFailure = "homepage has not switched to this build's asset manifest yet";
            }

            if (attempt < 18) await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          throw new Error("Frontend deployment verification failed after 90 seconds: " + lastFailure);
          NODE
