<!-- HTML entrypoint: Telegram WebApp SDK loads before the React module. #root is the mount point. -->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MUSIC SLAY 2026 — музыкальная премия" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>MUSIC SLAY 2026</title>
    <!-- Telegram injects WebApp.initData here; the Worker verifies it server-side. -->
    <script id="telegram-webapp-sdk" async src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"><main style="min-height:100dvh;display:grid;align-content:center;gap:12px;padding:32px 24px;background:#07060b;color:#f6f3fb;font:16px system-ui,sans-serif"><strong style="letter-spacing:.14em">MUSIC SLAY 2026</strong><span style="color:#9b94ab">Загрузка приложения…</span></main></div>
    <script>
      (function () {
        var root = document.getElementById("root");
        function showError(message) {
          if (!root || root.dataset.app === "mounted") return;
          root.innerHTML = '<main style="min-height:100dvh;display:grid;align-content:center;gap:12px;padding:32px 24px;background:#07060b;color:#f6f3fb;font:16px system-ui,sans-serif"><strong>MUSIC SLAY 2026</strong><h2 style="margin:0">Не удалось запустить приложение</h2><p style="color:#c5bdcf;overflow-wrap:anywhere">' + String(message).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}) + '</p><p style="color:#9b94ab">Сделай скриншот этого сообщения.</p></main>';
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          showError(event.message || (target && (target.src || target.href)) || "Ошибка загрузки JavaScript");
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          showError(event.reason && (event.reason.message || event.reason) || "Ошибка выполнения приложения");
        });
        window.setTimeout(function () {
          if (root && root.dataset.app !== "mounted") showError("React не смонтировал интерфейс за 10 секунд. Проверь загрузку JavaScript и консоль браузера.");
        }, 10000);
      })();
    </script>
    <!-- Vite entrypoint: mounts the React application into #root. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
