# Конфигурация Cloudflare Wrangler для production Worker.
# main — серверный обработчик; assets.directory — папка, создаваемая командой npm run build.
# binding ASSETS позволяет Worker отдавать React-приложение.
# run_worker_first направляет API и корневой запрос через Worker до обработки assets.
name = "music-slay-2026"
main = "worker/index.js"
compatibility_date = "2026-11-10"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/"]

[triggers]
crons = ["* * * * *"]

[vars]
APP_NAME = "MUSIC SLAY 2026"